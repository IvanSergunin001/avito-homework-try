# CI прогоняет ровно те же команды, что разработчик у себя: `make lint`, `make build`,
# `make test`. Ни одной отдельной «сборки для CI» здесь нет и быть не должно — иначе
# зелёный CI перестаёт означать, что то же самое зелено локально, и наоборот.
#
# Готовить окружение шагам не нужно: Go, линтер и инструменты живут в контейнерах
# (см. Dockerfile), а базу тестам поднимает их собственная оснастка. Всё, что нужно от
# агента, — Docker; на образах GitHub он есть.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Свежий пуш в ветку отменяет прогон по предыдущему: смысла проверять код, который уже
# заменили, нет, а очередь агентов общая.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линтер, сборка и тесты
    runs-on: ubuntu-latest
    # Предел с запасом на холодный кеш: в прогон попадают сборка образов, поднятие
    # системы сквозным тестом и контейнеры с базой у остальных тестов.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Линтер
        run: make lint

      - name: Сборка и go vet
        run: make build

      # Сюда же попадает сквозной тест: он поднимает систему через Compose сам, поэтому
      # отдельного шага «поднять окружение» перед тестами нет.
      - name: Тесты
        run: make test
