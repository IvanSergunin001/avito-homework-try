openapi: 3.0.3
info:
  title: Авито.Кухня — админская поверхность
  version: 1.0.0
  description: |
    Регистрация заведений, правка их реквизитов и отмена заказа саппортом.

    Доступ — `Authorization: Bearer <админский токен>`. Это не аутентификация сотрудника,
    а минимальная защита операций, которыми нельзя дать пользоваться посторонним: подмена
    адреса заведения означала бы увод чужих заказов. Токен приходит из конфигурации
    площадки; партнёрский ключ здесь не подходит и даёт `403`.

    Ошибки — `application/problem+json` (RFC 7807, актуализирован RFC 9457) с
    дополнительным полем `code`: машиночитаемая причина отказа.

    Общие с клиентской и партнёрской спецификациями схемы (ошибка, пагинация) намеренно
    продублированы: поверхности живут разными циклами выпуска.
servers:
  - url: https://kitchen.avito.ru/api/admin/v1
    description: Площадка
security:
  - adminToken: []
tags:
  - name: onboarding
    description: Подключение заведений и их реквизиты
  - name: support
    description: Разбор нештатных ситуаций
paths:
  /restaurants:
    post:
      operationId: registerRestaurant
      summary: Зарегистрировать заведение
      description: |
        Подключение нового партнёра: заводим заведение и выдаём ему партнёрский ключ.
        Ключ возвращается один раз — площадка хранит только его хеш.
      tags:
        - onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRestaurant'
      responses:
        '201':
          description: Заведение зарегистрировано, ключ выдан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredRestaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /restaurants/{restaurantId}:
    put:
      operationId: updateRestaurant
      summary: Изменить реквизиты заведения
      description: |
        Полная замена реквизитов: имя, адрес интеграции и активность. Смена адреса нужна,
        когда заведение переезжает на другой хост или порт, — правок в коде площадки это
        требовать не должно.
      tags:
        - onboarding
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantUpdate'
      responses:
        '200':
          description: Реквизиты обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrderBySupport
      summary: Отменить заказ по обращению заведения
      description: |
        Отмена, которую заведение не может выполнить само: после начала готовки партнёрский
        API отменять заказ не позволяет, потому что продукты уже списаны, покупателю нужна
        компенсация, а безнаказанная отмена — повод для злоупотреблений. Такие случаи проходят
        через саппорта, и в истории заказа остаётся `cancelled_by = support` с причиной.

        Заказ в терминальном статусе отменить нельзя — `409` с кодом `order_not_cancellable`.
      tags:
        - support
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportCancellation'
      responses:
        '200':
          description: Заказ отменён саппортом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Админский токен площадки из её конфигурации.
  schemas:
    NewRestaurant:
      type: object
      description: |
        Регистрация заведения. Адрес интеграции задаётся здесь, а не выводится из имени: смена
        инфраструктуры заведения не должна требовать правок в коде площадки.
      required:
        - name
        - base_url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Пекарня «Батон»
        base_url:
          type: string
          format: uri
          maxLength: 500
          description: Базовый адрес заведения, к которому площадка добавляет пути партнёрского контракта.
          example: https://baton.example.org
    RegisteredRestaurant:
      type: object
      description: |
        Только что зарегистрированное заведение вместе с партнёрским ключом. Ключ показывается
        один раз: площадка хранит только его хеш и восстановить его не сможет — потерянный ключ
        перевыпускается.
      required:
        - id
        - name
        - base_url
        - is_active
        - partner_key
      properties:
        id:
          type: string
          format: uuid
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a01
        name:
          type: string
          example: Пекарня «Батон»
        base_url:
          type: string
          format: uri
          example: https://baton.example.org
        is_active:
          type: boolean
          example: true
        partner_key:
          type: string
          description: Партнёрский ключ для заголовка `Authorization` партнёрской поверхности.
          example: pk_018f2b5c1f4a7c3e9a102b8f5d7c1a01
    ProblemCode:
      type: string
      description: |
        Машиночитаемая причина отказа. Перечень закрыт: клиент вправе разбирать его как
        перечисление, а расширение списка — изменение версии поверхности.
      enum:
        - validation_failed
        - unauthorized
        - forbidden
        - restaurant_not_found
        - order_not_found
        - order_not_cancellable
      example: validation_failed
    Problem:
      type: object
      description: |
        Отказ в формате `application/problem+json` (RFC 7807, актуализирован RFC 9457).
        Поле `code` — расширение стандарта: машиночитаемая причина, по которой инструмент
        выбирает ветку поведения. Текст `detail` предназначен человеку и может меняться без
        изменения версии поверхности.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Идентификатор типа проблемы. Отдельных URI не заводим — причину несёт `code`.
          example: about:blank
        title:
          type: string
          description: Короткое человекочитаемое название проблемы.
          example: Требуется авторизация
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Код ответа HTTP, продублированный в теле.
          example: 401
        detail:
          type: string
          description: Пояснение для человека, привязанное к конкретному случаю.
        instance:
          type: string
          format: uri-reference
          description: Ссылка на конкретное вхождение проблемы.
        code:
          $ref: '#/components/schemas/ProblemCode'
    RestaurantUpdate:
      type: object
      description: |
        Полная замена реквизитов заведения. Флаг активности здесь же: отключение заведения —
        та же операция правки, а не отдельная ручка, потому что причин отличать их нет.
      required:
        - name
        - base_url
        - is_active
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Пекарня «Батон»
        base_url:
          type: string
          format: uri
          maxLength: 500
          example: https://baton.example.org
        is_active:
          type: boolean
          example: true
    Restaurant:
      type: object
      description: Заведение глазами администратора площадки — с реквизитами интеграции.
      required:
        - id
        - name
        - base_url
        - is_active
      properties:
        id:
          type: string
          format: uuid
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a01
        name:
          type: string
          example: Пекарня «Батон»
        base_url:
          type: string
          format: uri
          example: https://baton.example.org
        is_active:
          type: boolean
          description: Ложь — заведение не показывается покупателю и его меню не синхронизируется.
          example: true
        last_synced_at:
          type: string
          format: date-time
          description: Когда каталог заведения синхронизировался последний раз.
    SupportCancellation:
      type: object
      description: |
        Отмена заказа саппортом. Причина обязательна: заказ отменяется уже после списания
        продуктов, её видит покупатель, и по ней же разбираются злоупотребления.
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Заведение сообщило, что закончились продукты
    OrderStatus:
      type: string
      description: |
        Статус заказа. Нетерминальные: `pending`, `under_review`, `confirmed`, `cooking`,
        `delivering`; терминальные: `completed`, `cancelled` — переходов из них нет.
      enum:
        - pending
        - under_review
        - confirmed
        - cooking
        - delivering
        - completed
        - cancelled
      example: cooking
    Money:
      type: integer
      format: int64
      minimum: 0
      description: |
        Сумма в копейках. Деньги — целые в минорных единицах: числа с плавающей точкой для
        денег непригодны, а `numeric` в Go всё равно вырождается в строку или float.
      example: 45000
    Quantity:
      type: integer
      minimum: 1
      maximum: 100
      description: Количество единиц товара в позиции заказа.
      example: 2
    OrderItem:
      type: object
      description: Позиция заказа снимком на момент оформления.
      required:
        - product_id
        - name
        - price
        - quantity
      properties:
        product_id:
          type: string
          format: uuid
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a02
        name:
          type: string
          example: Круассан с миндалём
        price:
          $ref: '#/components/schemas/Money'
        quantity:
          $ref: '#/components/schemas/Quantity'
    CancelledBy:
      type: string
      description: |
        Кто отменил заказ. Отмена саппортом отмечается `support`, а не `restaurant`: заведение
        после начала готовки отменяет заказ только обращением в саппорт, и в истории должно быть
        видно, что решение принимал человек площадки.
      enum:
        - customer
        - restaurant
        - support
      example: support
    Order:
      type: object
      description: Заказ глазами саппорта.
      required:
        - id
        - customer_id
        - restaurant_id
        - status
        - address
        - items
        - total
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a03
        customer_id:
          type: string
          format: uuid
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a04
        restaurant_id:
          type: string
          format: uuid
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a01
        status:
          $ref: '#/components/schemas/OrderStatus'
        address:
          type: string
          example: Москва, Лесная 7, кв. 12
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          $ref: '#/components/schemas/Money'
        cancelled_by:
          $ref: '#/components/schemas/CancelledBy'
        cancellation_reason:
          type: string
          maxLength: 500
          example: Закончились продукты
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: |
        Запрос не проходит проверку: `code` = `validation_failed`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: |
        Токен не передан или неизвестен: `code` = `unauthorized`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Токен есть, но он партнёрский: админские операции им не выполняются, `code` = `forbidden`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        Сущности с таким идентификатором нет.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        Заказ уже в терминальном статусе: отменять нечего, `code` = `order_not_cancellable`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Идентификатор заведения.
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      description: Идентификатор заказа.
      schema:
        type: string
        format: uuid
