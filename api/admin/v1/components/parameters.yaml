# Параметры админского API. Общий `User-Id` — в `api/common/v1`.

OrderId:
  name: orderId
  in: path
  required: true
  description: Идентификатор заказа.
  schema:
    type: string
    format: uuid

RestaurantId:
  name: restaurantId
  in: path
  required: true
  description: Идентификатор заведения.
  schema:
    type: string
    format: uuid
