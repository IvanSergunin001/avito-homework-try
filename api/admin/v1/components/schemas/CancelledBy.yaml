type: string
description: |
  Кто отменил заказ. Отмена саппортом отмечается `support`, а не `restaurant`: заведение
  после начала готовки отменяет заказ только обращением в саппорт, и в истории должно быть
  видно, что решение принимал человек площадки.
enum:
  - customer
  - restaurant
  - support
example: support
