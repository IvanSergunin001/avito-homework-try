type: object
description: Заказ глазами саппорта.
required:
  - id
  - customer_id
  - restaurant_id
  - status
  - address
  - items
  - total
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
    example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a03
  customer_id:
    type: string
    format: uuid
    example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a04
  restaurant_id:
    type: string
    format: uuid
    example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a01
  status:
    $ref: 'OrderStatus.yaml'
  address:
    type: string
    example: Москва, Лесная 7, кв. 12
  items:
    type: array
    minItems: 1
    items:
      $ref: 'OrderItem.yaml'
  total:
    $ref: '../../../../common/v1/components/schemas/Money.yaml'
  cancelled_by:
    $ref: '../../../../common/v1/components/schemas/CancelledBy.yaml'
  cancellation_reason:
    type: string
    maxLength: 500
    example: Закончились продукты
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
