type: object
description: Позиция заказа снимком на момент оформления.
required:
  - product_id
  - name
  - price
  - quantity
properties:
  product_id:
    type: string
    format: uuid
    example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a02
  name:
    type: string
    example: Круассан с миндалём
  price:
    $ref: 'Money.yaml'
  quantity:
    $ref: 'Quantity.yaml'
