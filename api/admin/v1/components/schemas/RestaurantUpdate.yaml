type: object
description: |
  Полная замена реквизитов заведения. Флаг активности здесь же: отключение заведения —
  та же операция правки, а не отдельная ручка, потому что причин отличать их нет.
required:
  - name
  - base_url
  - is_active
properties:
  name:
    type: string
    minLength: 1
    maxLength: 200
    example: Пекарня «Батон»
  base_url:
    type: string
    format: uri
    maxLength: 500
    example: https://baton.example.org
  is_active:
    type: boolean
    example: true
