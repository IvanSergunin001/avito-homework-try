# Админская поверхность площадки: онбординг заведений и разбор нештатных ситуаций
# саппортом. Потребитель — внутренний инструмент, а не покупатель и не партнёр.
#
# Источник разбит на файлы (`paths/`, `components/`) и перед генерацией собирается в
# один документ `bundle.yaml` (`make api`).
openapi: 3.0.3

info:
  title: Авито.Кухня — админская поверхность
  version: 1.0.0
  description: |
    Регистрация заведений, правка их реквизитов и отмена заказа саппортом.

    Доступ — `Authorization: Bearer <админский токен>`. Это не аутентификация сотрудника,
    а минимальная защита операций, которыми нельзя дать пользоваться посторонним: подмена
    адреса заведения означала бы увод чужих заказов. Токен приходит из конфигурации
    площадки; партнёрский ключ здесь не подходит и даёт `403`.

    Ошибки — `application/problem+json` (RFC 7807, актуализирован RFC 9457) с
    дополнительным полем `code`: машиночитаемая причина отказа.

    Общие с клиентской и партнёрской спецификациями схемы (ошибка, пагинация) намеренно
    продублированы: поверхности живут разными циклами выпуска.

servers:
  - url: https://kitchen.avito.ru/api/admin/v1
    description: Площадка

tags:
  - name: onboarding
    description: Подключение заведений и их реквизиты
  - name: support
    description: Разбор нештатных ситуаций

security:
  - adminToken: []

paths:
  /restaurants:
    $ref: 'paths/restaurants.yaml'
  /restaurants/{restaurantId}:
    $ref: 'paths/restaurant.yaml'
  /orders/{orderId}/cancel:
    $ref: 'paths/order_cancel.yaml'

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: Админский токен площадки из её конфигурации.
