post:
  operationId: registerRestaurant
  summary: Зарегистрировать заведение
  description: |
    Подключение нового партнёра: заводим заведение и выдаём ему партнёрский ключ.
    Ключ возвращается один раз — площадка хранит только его хеш.
  tags:
    - onboarding
  parameters:
    - $ref: '../../../common/v1/components/parameters/UserId.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/NewRestaurant.yaml'
  responses:
    '201':
      description: Заведение зарегистрировано, ключ выдан.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/RegisteredRestaurant.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
