# Параметры клиентского API. Общие с другими API (`User-Id`, `offset`) — в `api/common/v1`.

Limit:
  name: limit
  in: query
  required: false
  description: |
    Размер страницы витрины: по умолчанию 20, максимум 100. Потолок у каждого API свой,
    поэтому параметр не общий, в отличие от `offset`.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

OrderId:
  name: orderId
  in: path
  required: true
  description: Идентификатор заказа.
  schema:
    type: string
    format: uuid

ProductId:
  name: productId
  in: path
  required: true
  description: Идентификатор товара.
  schema:
    type: string
    format: uuid

RestaurantId:
  name: restaurantId
  in: path
  required: true
  description: Идентификатор заведения.
  schema:
    type: string
    format: uuid

SearchQuery:
  name: q
  in: query
  required: false
  description: |
    Подстрока названия товара. Поиск нечувствителен к регистру; пустая строка равнозначна
    отсутствию параметра.
  schema:
    type: string
    maxLength: 200
  example: круассан
