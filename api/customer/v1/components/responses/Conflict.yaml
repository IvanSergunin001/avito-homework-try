description: |
  Отказ по правилам предметной области. Причину несёт `code`, а не код ответа:

  - `out_of_stock` — товар закончился либо его осталось меньше, чем заказали; товар,
    из-за которого отказан заказ, приходит в `product_id`;
  - `price_changed` — цена заведения отличается от показанной на витрине; актуальная
    цена приходит в `current_price`, а площадка внеочередно обновляет каталог;
  - `unknown_product` — заведение убрало товар из меню, и витрина об этом ещё не знает;
  - `restaurant_closed` — заведение сейчас не принимает заказы;
  - `order_not_cancellable` — заказ уже нельзя отменить;
  - `idempotency_key_reuse` — идентификатор заказа занят чужим заказом. Чем именно он
    занят, не сообщается: по разным ответам перебор идентификаторов рассказал бы, какие
    заказы на площадке есть. Клиенту остаётся выдать новый идентификатор.
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
