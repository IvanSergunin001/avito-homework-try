description: |
  Идентификатор заказа уже использован для другого состава: `code` = `idempotency_key_reuse`.

  Это не повтор, а переиспользование ключа: тем же идентификатором оформляют другой
  заказ. Отдать в ответ уже созданный заказ площадка не вправе — это подтвердило бы
  покупку, которой клиент не делал. Ответ на такой отказ — новый идентификатор заказа.
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
