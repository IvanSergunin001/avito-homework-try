type: object
description: |
  Оформление заказа. `order_id` генерирует клиент в формате uuid v7; он же — ключ
  идемпотентности (README, «Оформление заказа»).
required:
  - order_id
  - restaurant_id
  - address
  - items
properties:
  order_id:
    type: string
    format: uuid
    example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a03
  restaurant_id:
    type: string
    format: uuid
    example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a01
  address:
    type: string
    minLength: 1
    maxLength: 500
    example: Москва, Лесная 7, кв. 12
  items:
    type: array
    minItems: 1
    maxItems: 100
    items:
      $ref: 'NewOrderItem.yaml'
