type: object
description: |
  Позиция заказа. Название и цена — снимок на момент оформления: обновление каталога
  не должно переписывать историю покупателя задним числом.
required:
  - product_id
  - name
  - price
  - quantity
properties:
  product_id:
    type: string
    format: uuid
    example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a02
  name:
    type: string
    example: Круассан с миндалём
  price:
    $ref: '../../../../common/v1/components/schemas/Money.yaml'
  quantity:
    $ref: '../../../../common/v1/components/schemas/Quantity.yaml'
