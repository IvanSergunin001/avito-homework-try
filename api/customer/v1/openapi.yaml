# Клиентская поверхность площадки: её потребитель — веб-приложение покупателя.
#
# Источник спецификации разбит на файлы (`paths/`, `components/`) и перед генерацией
# собирается в один документ `bundle.yaml`: кодогенератор и внешние читатели получают
# самодостаточный файл, а не дерево ссылок. Правится только этот источник — `bundle.yaml`
# пересобирается командой `make api`.
openapi: 3.0.3

info:
  title: Авито.Кухня — клиентская поверхность
  version: 1.0.0
  description: |
    Каталог заведений, меню, поиск товаров и заказы покупателя.

    Аутентификации нет: покупатель называет себя заголовком `X-User-Id`. Это не
    удостоверение, а самопровозглашённый идентификатор, которому площадка верит по условию
    задания; заказы связываются с ним, чтобы покупатель не видел чужие.

    Ошибки — `application/problem+json` (RFC 7807, актуализирован RFC 9457) с
    дополнительным полем `code`: машиночитаемая причина отказа, по которой клиент выбирает
    ветку поведения, не разбирая человеческий текст.

    Поверхность живёт своим циклом: общие с партнёрской и админской спецификациями схемы
    (ошибка, пагинация) намеренно продублированы, а не вынесены в общий файл.

servers:
  - url: https://kitchen.avito.ru/api/v1
    description: Площадка

# Аутентификации у клиентской поверхности нет по условию задания — объявляем это явно,
# чтобы отсутствие защиты читалось как решение, а не как забытая строка.
security: []

tags:
  - name: catalog
    description: Каталог заведений и товаров
  - name: orders
    description: Оформление заказа, его статус и отмена

paths:
  /restaurants:
    $ref: 'paths/restaurants.yaml'
  /restaurants/{restaurantId}:
    $ref: 'paths/restaurant.yaml'
  /restaurants/{restaurantId}/products:
    $ref: 'paths/restaurant_products.yaml'
  /products:
    $ref: 'paths/products.yaml'
  /products/{productId}:
    $ref: 'paths/product.yaml'
  /orders:
    $ref: 'paths/orders.yaml'
  /orders/{orderId}:
    $ref: 'paths/order.yaml'
  /orders/{orderId}/cancel:
    $ref: 'paths/order_cancel.yaml'
