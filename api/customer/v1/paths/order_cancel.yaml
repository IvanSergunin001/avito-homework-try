post:
  operationId: cancelOrder
  summary: Отменить заказ
  description: |
    Покупатель отменяет заказ, пока его не начали готовить: из `pending`, `under_review`
    и `confirmed`. С `cooking` и дальше — `409` с кодом `order_not_cancellable`: продукты
    уже потрачены, такие случаи разбирает саппорт.

    Повторная отмена уже отменённого заказа возвращает `200`: ретрай не должен ломаться.
  tags:
    - orders
  parameters:
    - $ref: '../components/parameters.yaml#/OrderId'
    - $ref: '../../../common/v1/components/parameters.yaml#/UserId'
  responses:
    '200':
      description: Заказ отменён.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Order'
    '400':
      $ref: '../../../common/v1/components/responses.yaml#/BadRequest'
    '404':
      $ref: '../../../common/v1/components/responses.yaml#/NotFound'
    '409':
      $ref: '../components/responses.yaml#/Conflict'
    '413':
      $ref: '../../../common/v1/components/responses.yaml#/RequestEntityTooLarge'
