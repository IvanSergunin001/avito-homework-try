get:
  operationId: searchProducts
  summary: Поиск товара по всем заведениям
  description: |
    Ищем блюдо, а не заведение: выдача идёт по всем активным заведениям сразу.
  tags:
    - catalog
  parameters:
    - $ref: '../components/parameters.yaml#/SearchQuery'
    - $ref: '../components/parameters.yaml#/Limit'
    - $ref: '../../../common/v1/components/parameters.yaml#/Offset'
  responses:
    '200':
      description: Страница выдачи товаров.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ProductPage'
    '400':
      $ref: '../../../common/v1/components/responses.yaml#/BadRequest'
