get:
  operationId: listRestaurantProducts
  summary: Меню заведения
  description: |
    Постраничное меню одного заведения. Параметр `q` сужает выдачу до товаров, чьё
    название содержит подстроку, — так поиск можно ограничить одним заведением.
  tags:
    - catalog
  parameters:
    - $ref: '../components/parameters/RestaurantId.yaml'
    - $ref: '../components/parameters/SearchQuery.yaml'
    - $ref: '../components/parameters/Limit.yaml'
    - $ref: '../components/parameters/Offset.yaml'
  responses:
    '200':
      description: Страница меню.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ProductPage.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
