type: object
description: |
  Страница выдачи: смещение и размер, которые запросил оператор, плюс общее число позиций
  в меню.
required:
  - limit
  - offset
  - total
properties:
  limit:
    type: integer
    minimum: 1
    maximum: 100
    description: Сколько позиций запрошено на страницу.
    example: 20
  offset:
    type: integer
    minimum: 0
    description: Сколько позиций пропущено от начала выдачи.
    example: 0
  total:
    type: integer
    format: int64
    minimum: 0
    description: Сколько позиций всего в меню.
    example: 42
