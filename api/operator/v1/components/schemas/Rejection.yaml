type: object
description: |
  Отказ заведения от заказа на этапе рассмотрения. Причина обязательна: её площадка
  показывает покупателю, и «заказ отменён» без объяснения — это обращение в поддержку,
  а не ответ.
required:
  - reason
properties:
  reason:
    type: string
    minLength: 1
    maxLength: 500
    example: Закончились продукты
