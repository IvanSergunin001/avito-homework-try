post:
  operationId: confirmOrder
  summary: Подтвердить заказ
  description: |
    Оператор берётся за заказ: заведение выполнит его, и площадка сообщит об этом
    покупателю. Подтвердить можно только заказ на рассмотрении — уже подтверждённый или
    отклонённый заказ отвечает `409`.
  tags:
    - orders
  parameters:
    - $ref: '../components/parameters/OrderId.yaml'
  responses:
    '200':
      description: Заказ подтверждён.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Order.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '404':
      $ref: '../components/responses/OrderNotFound.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
