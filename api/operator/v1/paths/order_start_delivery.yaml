post:
  operationId: startDelivery
  summary: Отправить заказ в доставку
  description: |
    Заказ приготовлен и уехал к покупателю. Площадка узнаёт об этом уведомлением и
    показывает статус покупателю.

    Отправить в доставку можно только готовящийся заказ: ступень пути не
    перепрыгивается, и заказ в любом другом состоянии отвечает `409`.
  tags:
    - orders
  parameters:
    - $ref: '../components/parameters/OrderId.yaml'
  responses:
    '200':
      description: Заказ в доставке.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Order.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '404':
      $ref: '../components/responses/OrderNotFound.yaml'
    '409':
      $ref: '../components/responses/TransitionNotAllowed.yaml'
