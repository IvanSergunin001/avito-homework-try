# Клиент партнёрского контракта — целиком, обе его стороны. Им площадка ходит в заведение
# (тег `restaurant`), им же коробка уведомляет площадку о смене статуса заказа (тег
# `platform`), им же тесты шва коробки проверяют её половину контракта. Тега здесь нет
# намеренно: половинки контракта зовут друг друга, а два клиента означали бы две копии
# одних и тех же моделей в разных пакетах.
package: partner
output: api/partner/v1/client.gen.go
generate:
  client: true
  models: true
