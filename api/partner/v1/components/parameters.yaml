# Параметры партнёрского контракта. Общие с другими API — в `api/common/v1`.

Limit:
  name: limit
  in: query
  required: false
  description: |
    Размер страницы меню: по умолчанию 100, максимум 500. Страничная выдача — обязанность
    заведения, а не рекомендация.
  schema:
    type: integer
    minimum: 1
    maximum: 500
    default: 100

OrderId:
  name: orderId
  in: path
  required: true
  description: Идентификатор заказа на площадке.
  schema:
    type: string
    format: uuid
