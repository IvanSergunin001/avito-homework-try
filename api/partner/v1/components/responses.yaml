# Отказы, специфичные для партнёрского контракта. Одинаковые для всех API (400, 401,
# 403, 404) — в `api/common/v1`.

Conflict:
  description: |
    Отказ по правилам предметной области: стоп-лист, изменившаяся цена, неизвестная позиция, закрытое заведение, непозволительная отмена.
  content:
    application/problem+json:
      schema:
        $ref: 'schemas.yaml#/Problem'
