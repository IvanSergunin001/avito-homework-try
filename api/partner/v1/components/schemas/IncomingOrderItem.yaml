type: object
description: |
  Позиция передаваемого заказа. Цена — та, по которой площадка показала позицию
  покупателю: заведение сверяет её со своей и при расхождении отказывает кодом
  `price_changed`, сообщая актуальную цену.
required:
  - external_id
  - quantity
  - price
properties:
  external_id:
    type: string
    minLength: 1
    maxLength: 200
    example: croissant-almond
  quantity:
    $ref: '../../../../common/v1/components/schemas/Quantity.yaml'
  price:
    $ref: '../../../../common/v1/components/schemas/Money.yaml'
