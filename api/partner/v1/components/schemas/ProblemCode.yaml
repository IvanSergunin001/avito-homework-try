type: string
description: |
  Машиночитаемая причина отказа. Перечень закрыт: обе стороны вправе разбирать его как
  перечисление, а расширение списка — изменение версии контракта.
enum:
  - validation_failed
  - unauthorized
  - forbidden
  - order_not_found
  - out_of_stock
  - price_changed
  - unknown_product
  - restaurant_closed
  - order_not_cancellable
example: out_of_stock
