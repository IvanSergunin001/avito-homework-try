# Партнёрский контракт «площадка ↔ заведение» — самостоятельный документ-продукт для
# сторонних заведений, а не побочный артефакт кода. Описывает обе стороны интеграции:
# что обязано реализовать заведение и что площадка предоставляет ему в ответ.
#
# Источник разбит на файлы (`paths/`, `components/`) и перед генерацией собирается в
# `bundle.yaml` — именно его отдают партнёру и по нему генерируется код (`make api`).
openapi: 3.0.3

info:
  title: Авито.Кухня — партнёрский контракт
  version: 1.0.0
  description: |
    Контракт интеграции заведения с площадкой. Две стороны, различаются тегом:

    - `restaurant` — операции, которые **обязано реализовать заведение**: постраничная
      выдача меню, приём заказа, отмена принятого заказа. Заведение со своей системой
      реализует их само; заведению без своей системы площадка даёт готовую коробку.
    - `platform` — операции, которые **площадка предоставляет заведению**: внеочередное
      обновление каталога и уведомление о смене статуса заказа.

    Каталог площадка забирает сама (pull) по расписанию; ручка обновления нужна, чтобы
    изменение цены или стоп-листа доехало до витрины сразу, а не по таймеру.

    Операции площадки закрыты партнёрским ключом: `Authorization: Bearer <ключ>`.
    Стандартный заголовок выбран вместо произвольного `X-`-заголовка потому, что прокси,
    логгеры и системы трассировки маскируют `Authorization` по умолчанию, тогда как
    произвольный заголовок утекает в логи открытым текстом.

    Операции заведения в MVP вызываются без аутентификации: площадка не хранит выданного
    ей заведением секрета (в её схеме есть только хеш партнёрского ключа для входящих
    вызовов). В эксплуатации сюда встают mTLS или выдаваемый при онбординге токен
    площадки — см. раздел упрощений в README.

    Ошибки обеих сторон — `application/problem+json` (RFC 7807, актуализирован RFC 9457)
    с дополнительным полем `code`: машиночитаемая причина отказа.

    Общие с клиентской и админской спецификациями схемы — основа ошибки, список кодов
    причин, страница выдачи и деньги — лежат в `api/common/v1` и подключаются `$ref`'ом.
    Партнёру это незаметно: наружу уходит `bundle.yaml`, в котором ссылки уже развёрнуты.

servers:
  - url: '{restaurantBaseUrl}/api/kitchen/v1/restaurant'
    description: |
      Заведение. `restaurantBaseUrl` — адрес, который заведение сообщило площадке при
      онбординге; операции с тегом `platform` переопределяют сервер на адрес площадки.
    variables:
      restaurantBaseUrl:
        default: https://restaurant.example.org
        description: |
          При локальном запуске через Compose — `http://localhost:8081`; операции с тегом
          `platform` живут на площадке, `http://localhost:8080`.

tags:
  - name: restaurant
    description: Реализует заведение
  - name: platform
    description: Реализует площадка

security: []

paths:
  /menu:
    $ref: 'paths/menu.yaml'
  /orders:
    $ref: 'paths/orders.yaml'
  /orders/{orderId}/cancel:
    $ref: 'paths/order_cancel.yaml'
  /catalog/refresh:
    $ref: 'paths/catalog_refresh.yaml'
  /orders/{orderId}/status:
    $ref: 'paths/order_status.yaml'

components:
  securitySchemes:
    partnerKey:
      type: http
      scheme: bearer
      description: |
        Партнёрский ключ, выданный заведению при онбординге. Площадка находит заведение
        по хешу ключа: самого ключа она не хранит.
