post:
  operationId: cancelAcceptedOrder
  summary: Отменить принятый заказ (реализует заведение)
  description: |
    Площадка просит заведение отменить заказ — так доезжает отмена покупателем.
    После начала готовки заведение вправе отказать кодом `order_not_cancellable`.
    Повторная отмена уже отменённого заказа возвращает `200`: ретрай не должен ломаться.
  tags:
    - restaurant
  parameters:
    - $ref: '../components/parameters.yaml#/OrderId'
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/CancellationRequest'
  responses:
    '200':
      description: Заказ отменён.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/OrderCancellation'
    '400':
      $ref: '../../../common/v1/components/responses.yaml#/BadRequest'
    '404':
      $ref: '../../../common/v1/components/responses.yaml#/NotFound'
    '409':
      $ref: '../components/responses.yaml#/Conflict'
    '413':
      $ref: '../../../common/v1/components/responses.yaml#/RequestEntityTooLarge'
