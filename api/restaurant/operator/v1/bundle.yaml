openapi: 3.0.3
info:
  title: Авито.Кухня — рабочее место оператора коробки заведения
  version: 1.0.0
  description: |
    Коробку берёт заведение, у которого своих систем нет, поэтому меню в ней кто-то
    должен вести — этим занимается оператор заведения.

    Оператор заводит, правит и удаляет позиции, отмечает позицию в стоп-листе и ведёт
    остаток. Наружу, площадке, коробка отдаёт то же меню по партнёрскому контракту
    (`api/partner/v1`), но короче: остаток и отметка стоп-листа — внутренняя кухня
    заведения, площадке достаточно ответа «заказать можно или нельзя».

    Здесь же оператор разбирает входящие заказы: видит их состав и адрес, подтверждает
    заказ или отклоняет его на этапе рассмотрения, а дальше ведёт его по пути — готовка,
    доставка, завершение. Сами заказы приходят в коробку по партнёрскому контракту, и
    решение оператора уезжает обратно площадке — рабочее место не принимает заказы и не
    выдумывает их состав.

    Путь заказа идёт в одну сторону и ступеней не перепрыгивает: подтверждён — готовится
    — в доставке — завершён. Переход, которого на этом пути нет, отвечает `409`: заказ,
    который «доставлен», ни разу не выехав, — это не состояние заведения, а расхождение
    рабочего места с кухней.

    Позиция считается доступной, когда она не в стоп-листе и её остаток больше нуля.
    Признак `is_available` в ответах — тот же, что уезжает площадке: оператор видит
    последствие своей правки, не заглядывая в партнёрскую выдачу.

    Ошибки — `application/problem+json` (RFC 7807, актуализирован RFC 9457) с
    дополнительным полем `code`: машиночитаемая причина отказа.

    Операции не закрыты токеном: аутентификация исключена заданием, а рабочее место
    живёт во внутреннем контуре заведения и наружу не публикуется. В эксплуатации сюда
    встаёт вход оператора — см. раздел упрощений в README.

    Общие с остальными спецификациями схемы — основа ошибки, список кодов причин, деньги
    и страница выдачи — лежат в `api/common/v1` и подключаются `$ref`'ом. Собранный
    `bundle.yaml` от этого самодостаточен: ссылки в нём уже развёрнуты.
servers:
  - url: '{restaurantBaseUrl}/api/kitchen/v1/restaurant/operator'
    description: |
      Коробка заведения. Партнёрский контракт коробка отдаёт под `/api/kitchen/v1/restaurant`,
      рабочее место оператора — здесь: у документов разные потребители и разные циклы.
    variables:
      restaurantBaseUrl:
        default: http://localhost:8081
security: []
tags:
  - name: menu
    description: Меню, стоп-лист и остатки
  - name: orders
    description: Входящие заказы
paths:
  /menu:
    get:
      operationId: listMenuItems
      summary: Меню заведения глазами оператора
      description: |
        Постраничный список позиций. В отличие от партнёрской выдачи, здесь видны остаток и
        отметка стоп-листа: оператору нужно понимать, почему позиция недоступна, а площадке —
        только то, можно ли её заказать.
      tags:
        - menu
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница меню.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: addMenuItem
      summary: Завести позицию меню
      description: |
        Идентификатор позиции выдаёт коробка: он же уезжает площадке как `external_id`
        партнёрского контракта и остаётся неизменным до удаления позиции — площадка обновляет
        каталог по паре «заведение + `external_id`».
      tags:
        - menu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMenuItem'
      responses:
        '201':
          description: Позиция заведена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
  /menu/{itemId}:
    put:
      operationId: updateMenuItem
      summary: Изменить позицию меню
      description: |
        Полная замена карточки позиции: название, описание и цена. Остаток и стоп-лист сюда
        не входят — это отдельные операции: карточку правят редко и обдуманно, а стоп-лист и
        остаток меняются в течение дня, и смешивать их значило бы переписывать цену при
        каждой отметке «закончилось».
      tags:
        - menu
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemUpdate'
      responses:
        '200':
          description: Позиция изменена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeMenuItem
      summary: Удалить позицию меню
      description: |
        Позиция исчезает из выдачи по партнёрскому контракту, и площадка деактивирует её на
        витрине при ближайшей синхронизации каталога. Позицию, которая просто закончилась,
        удалять не нужно — для этого есть стоп-лист.
      tags:
        - menu
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      responses:
        '204':
          description: Позиции больше нет.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /menu/{itemId}/stop-list:
    put:
      operationId: setStopListMark
      summary: Отметить позицию в стоп-листе или снять отметку
      description: |
        Отметка и её снятие — одна операция с булевым значением, а не две ручки: состояние у
        позиции одно, и повторный вызов с тем же значением ничего не меняет.

        Позиция в стоп-листе остаётся в меню, но уезжает площадке недоступной: убрать её из
        выдачи вместо этого нельзя — покупатель искал бы блюдо, которое вчера видел, и не
        находил его без объяснения.
      tags:
        - menu
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopListMark'
      responses:
        '200':
          description: Отметка выставлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /menu/{itemId}/stock:
    put:
      operationId: setStock
      summary: Задать остаток позиции
      description: |
        Остаток задаётся целиком, а не приращением: оператор пересчитал и сообщил, сколько
        осталось, — повтор запроса по таймауту не должен списать порцию дважды.

        Позиция с нулевым остатком уезжает площадке недоступной, даже если она не в
        стоп-листе: заказывать нечего.
      tags:
        - menu
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockUpdate'
      responses:
        '200':
          description: Остаток записан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders:
    get:
      operationId: listOrders
      summary: Входящие заказы
      description: |
        Постраничный список заказов, которые площадка передала коробке: состав, адрес
        доставки и состояние. Свежие идут первыми — оператор работает с началом списка.

        Заказы не пропадают из списка после решения: оператору нужно видеть, что он уже
        подтвердил и от чего отказался, а не только то, что ждёт решения.
      tags:
        - orders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница заказов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders/{orderId}/confirm:
    post:
      operationId: confirmOrder
      summary: Подтвердить заказ
      description: |
        Оператор берётся за заказ: заведение выполнит его, и площадка сообщит об этом
        покупателю. Подтвердить можно только заказ на рассмотрении — уже подтверждённый или
        отклонённый заказ отвечает `409`.
      tags:
        - orders
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ подтверждён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{orderId}/reject:
    post:
      operationId: rejectOrder
      summary: Отклонить заказ на этапе рассмотрения
      description: |
        Заведение не берётся за заказ и объясняет причину — её площадка показывает
        покупателю. Отклонить можно только заказ на рассмотрении: после подтверждения заказ
        уже в работе, и отменяют его иначе.

        Остатки, списанные при приёме заказа, возвращаются в меню: продукты на отклонённый
        заказ не потрачены, и позиция снова продаётся.
      tags:
        - orders
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rejection'
      responses:
        '200':
          description: Заказ отклонён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{orderId}/start-cooking:
    post:
      operationId: startCooking
      summary: Отправить заказ в готовку
      description: |
        Оператор берёт подтверждённый заказ в работу: на кухне начали готовить. Площадка
        узнаёт об этом уведомлением и показывает статус покупателю.

        Отправить в готовку можно только подтверждённый заказ: путь заказа идёт в одну
        сторону, и перепрыгнуть ступень нельзя — заказ, который ещё не подтверждён или уже
        уехал, отвечает `409`.
      tags:
        - orders
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ готовится.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/TransitionNotAllowed'
  /orders/{orderId}/start-delivery:
    post:
      operationId: startDelivery
      summary: Отправить заказ в доставку
      description: |
        Заказ приготовлен и уехал к покупателю. Площадка узнаёт об этом уведомлением и
        показывает статус покупателю.

        Отправить в доставку можно только готовящийся заказ: ступень пути не
        перепрыгивается, и заказ в любом другом состоянии отвечает `409`.
      tags:
        - orders
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ в доставке.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/TransitionNotAllowed'
  /orders/{orderId}/complete:
    post:
      operationId: completeOrder
      summary: Завершить заказ
      description: |
        Заказ доставлен покупателю — это конец его пути: из завершённого заказа переходов
        нет, и повторное завершение отвечает `409`.

        Завершить можно только заказ в доставке: заказ, который ещё не уехал, доставленным
        не бывает.
      tags:
        - orders
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ завершён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/TransitionNotAllowed'
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы. По умолчанию 20, больше 100 за раз коробка не отдаёт.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Сколько записей пропустить от начала выдачи.
      schema:
        type: integer
        minimum: 0
        default: 0
    MenuItemId:
      name: itemId
      in: path
      required: true
      description: |
        Идентификатор позиции в коробке. Он же уезжает площадке как `external_id`
        партнёрского контракта.
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      description: Идентификатор заказа в коробке заведения.
      schema:
        type: string
        format: uuid
  schemas:
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Сумма в копейках — целое в минорных единицах (почему так, см. README).
      example: 45000
    Stock:
      type: integer
      minimum: 0
      maximum: 1000000
      description: |
        Остаток позиции в штуках. Ноль — заказать нечего: позиция уезжает площадке недоступной,
        но из меню не пропадает. Верхняя граница отсекает опечатку в форме: остатка больше
        миллиона порций у кухни не бывает, а число сверх него коробке негде хранить.
      example: 12
    MenuItem:
      type: object
      description: |
        Позиция меню глазами оператора: карточка, остаток, отметка стоп-листа и итог —
        доступна ли позиция площадке.
      required:
        - id
        - name
        - price
        - stock
        - in_stop_list
        - is_available
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор позиции; он же — `external_id` партнёрского контракта.
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a04
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Круассан с миндалём
        description:
          type: string
          maxLength: 2000
          example: Слоёное тесто, миндальный крем
        price:
          $ref: '#/components/schemas/Money'
        stock:
          $ref: '#/components/schemas/Stock'
        in_stop_list:
          type: boolean
          description: Оператор отметил, что позиции сейчас нет.
          example: false
        is_available:
          type: boolean
          description: |
            Итог, который видит площадка: позиция не в стоп-листе и её остаток больше нуля.
            Значение вычисляется коробкой и в запросах не принимается — им управляют отметка
            стоп-листа и остаток.
          example: true
    PageMeta:
      type: object
      description: |
        Страница выдачи по смещению. Потолок страницы объявляет параметр `limit` той операции,
        которая её отдаёт: у витрины и у меню он разный. Почему offset, а не курсор, — README.
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
          minimum: 1
          description: Сколько записей запрошено на страницу.
          example: 20
        offset:
          type: integer
          minimum: 0
          description: Сколько записей пропущено от начала выдачи.
          example: 0
        total:
          type: integer
          format: int64
          minimum: 0
          description: Сколько записей всего удовлетворяет запросу.
          example: 42
    MenuItemPage:
      type: object
      description: Страница меню.
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
        page:
          $ref: '#/components/schemas/PageMeta'
    ProblemCode:
      type: string
      description: |
        Машиночитаемая причина отказа — единственный список кодов на все API: два списка
        разъезжаются, и один и тот же отказ начинает называться по-разному. Плата за общий
        список — API объявляет и те коды, которых сам не возвращает.
      enum:
        - validation_failed
        - not_implemented
        - internal_error
        - unauthorized
        - forbidden
        - restaurant_not_found
        - product_not_found
        - order_not_found
        - order_not_under_review
        - transition_not_allowed
        - menu_item_not_found
        - out_of_stock
        - price_changed
        - unknown_product
        - restaurant_closed
        - order_not_cancellable
        - idempotency_key_reuse
        - restaurant_unavailable
      example: validation_failed
    ProblemBase:
      type: object
      description: |
        Отказ в формате `application/problem+json` (RFC 9457) — общая для всех API часть.
        Машиночитаемая причина — в `code`; `detail` предназначен человеку и меняется без версии.
        Своё поле API добавляет к этой основе через `allOf`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: |
            Идентификатор типа проблемы. Пока всегда `about:blank`: отдельных страниц под
            причины нет, идентичность несёт `code`.
          example: about:blank
        title:
          type: string
          description: Короткое человекочитаемое название проблемы.
          example: Некорректный запрос
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Код ответа HTTP, продублированный в теле.
          example: 400
        detail:
          type: string
          description: Пояснение для человека, привязанное к конкретному случаю.
          example: 'limit: допустимы значения от 1 до 100'
        instance:
          type: string
          format: uri-reference
          nullable: true
          description: |
            Ссылка на конкретный случай отказа, а не на его тип. Пока не заполняется; появится,
            когда по отказу нужно будет попадать в журнал или в обращение поддержки.
        code:
          $ref: '#/components/schemas/ProblemCode'
    NewMenuItem:
      type: object
      description: |
        Новая позиция меню. Остаток указывается сразу: позиция без остатка недоступна, и
        умолчание здесь решало бы за оператора, продаётся его блюдо или нет.
      required:
        - name
        - price
        - stock
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Круассан с миндалём
        description:
          type: string
          maxLength: 2000
          example: Слоёное тесто, миндальный крем
        price:
          $ref: '#/components/schemas/Money'
        stock:
          $ref: '#/components/schemas/Stock'
    MenuItemUpdate:
      type: object
      description: |
        Полная замена карточки позиции. Описание можно не присылать — тогда его не станет:
        это правка карточки целиком, а не частичная.
      required:
        - name
        - price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Круассан с миндалём
        description:
          type: string
          maxLength: 2000
          example: Слоёное тесто, миндальный крем
        price:
          $ref: '#/components/schemas/Money'
    StopListMark:
      type: object
      description: |
        Отметка стоп-листа. Истина — позиции сейчас нет, ложь — снова в наличии.
      required:
        - in_stop_list
      properties:
        in_stop_list:
          type: boolean
          example: true
    StockUpdate:
      type: object
      description: Новый остаток позиции — целиком, а не приращением.
      required:
        - stock
      properties:
        stock:
          $ref: '#/components/schemas/Stock'
    OrderStatus:
      type: string
      description: |
        Состояние заказа в коробке. `under_review` — заказ принят по партнёрскому контракту и
        ждёт решения оператора; `confirmed` — оператор взялся за него; `cooking` — заказ
        готовится; `delivering` — уехал к покупателю; `completed` — доставлен; `cancelled` —
        оператор отклонил его на этапе рассмотрения.

        Путь заказа идёт в одну сторону: `under_review` → `confirmed` → `cooking` →
        `delivering` → `completed`. `completed` и `cancelled` конечны — переходов из них нет.

        Отклонённый заказ становится именно отменённым, а не «отклонённым»: это тот же статус,
        о котором коробка сообщает площадке, и заводить для одного состояния два названия
        значило бы переводить одно в другое на каждой границе.
      enum:
        - under_review
        - confirmed
        - cooking
        - delivering
        - completed
        - cancelled
      example: under_review
    Quantity:
      type: integer
      minimum: 1
      maximum: 100
      description: Количество единиц товара в позиции заказа.
      example: 2
    OrderItem:
      type: object
      description: |
        Позиция заказа — снимок на момент приёма: название и цена сохранены такими, какими
        были, когда заказ приняли. Правка меню задним числом заказ не меняет: оператор готовит
        то, что заказал покупатель, и по той цене, которую тот видел.
      required:
        - menu_item_id
        - name
        - quantity
        - price
      properties:
        menu_item_id:
          type: string
          format: uuid
          description: |
            Позиция меню, из которой собран заказ. Позицию могли с тех пор изменить или удалить —
            состав заказа от этого не меняется.
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a04
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Круассан с миндалём
        quantity:
          $ref: '#/components/schemas/Quantity'
        price:
          $ref: '#/components/schemas/Money'
    Order:
      type: object
      description: |
        Входящий заказ глазами оператора: состав, адрес доставки и состояние. По нему оператор
        решает, берётся заведение за заказ или нет.
      required:
        - id
        - platform_order_id
        - status
        - address
        - items
        - total
        - accepted_at
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор заказа в коробке.
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a05
        platform_order_id:
          type: string
          format: uuid
          description: |
            Тот же заказ на площадке. Хранится ссылкой, а не подменяет собой идентификатор
            коробки: по нему разбираются с площадкой, когда заказ вызывает вопросы.
          example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a03
        status:
          $ref: '#/components/schemas/OrderStatus'
        address:
          type: string
          minLength: 1
          maxLength: 500
          description: Адрес доставки в свободной форме, как его передала площадка.
          example: Москва, Лесная 7, кв. 12
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Сумма заказа, посчитанная коробкой по своим ценам.
        cancellation_reason:
          type: string
          maxLength: 500
          description: |
            Причина, по которой оператор отклонил заказ. Есть только у отклонённого заказа:
            площадка показывает её покупателю.
          example: Закончились продукты
        placed_at:
          type: string
          format: date-time
          description: Когда покупатель оформил заказ на площадке; площадка может его не прислать.
        accepted_at:
          type: string
          format: date-time
          description: Когда коробка приняла заказ по партнёрскому контракту.
    OrderPage:
      type: object
      description: Страница входящих заказов.
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          $ref: '#/components/schemas/PageMeta'
    Rejection:
      type: object
      description: Причина, по которой оператор не берётся за заказ.
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Закончились продукты
  responses:
    BadRequest:
      description: |
        Запрос не проходит проверку: `code` = `validation_failed`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemBase'
    NotFound:
      description: |
        Ресурса с таким идентификатором нет или он недоступен обратившемуся.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemBase'
    OrderNotFound:
      description: |
        Заказа с таким идентификатором в коробке нет: `code` = `order_not_found`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemBase'
    Conflict:
      description: |
        Заказ уже не на рассмотрении — его подтвердили или отклонили раньше:
        `code` = `order_not_under_review`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemBase'
    TransitionNotAllowed:
      description: |
        Заказ отсюда в это состояние не переходит: `code` = `transition_not_allowed`.
        В `detail` — обе стороны перехода, которого потребовали: по ним оператор видит,
        в каком состоянии заказ на самом деле.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemBase'
