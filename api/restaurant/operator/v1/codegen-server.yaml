# Рабочее место оператора коробки заведения: серверный интерфейс и модели. Документ
# принадлежит коробке и стоит сверх партнёрского контракта — площадка о нём не знает.
#
# Строгий интерфейс здесь не используется намеренно, в отличие от остальных документов:
# он отдаёт обработчику уже разобранное тело, в котором отсутствующее поле неотличимо от
# нулевого значения. Рабочему месту эта разница важна — запрос без цены завёл бы
# бесплатную позицию, без остатка недоступную, а без отметки снял бы позицию со стопа, —
# поэтому обработчики читают тело сами и сверяют обязательные поля со спецификацией.
package: operator_v1
output: internal/restaurant/adapters/http/operator_v1/server.gen.go
generate:
  chi-server: true
  models: true
