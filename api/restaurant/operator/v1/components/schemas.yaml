# Схемы рабочего места оператора. Общие с другими API — деньги, страница выдачи, основа
# отказа — подключаются из `api/common/v1`.

MenuItem:
  type: object
  description: |
    Позиция меню глазами оператора: карточка, остаток, отметка стоп-листа и итог —
    доступна ли позиция площадке.
  required:
    - id
    - name
    - price
    - stock
    - in_stop_list
    - is_available
  properties:
    id:
      type: string
      format: uuid
      description: Идентификатор позиции; он же — `external_id` партнёрского контракта.
      example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a04
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: Круассан с миндалём
    description:
      type: string
      maxLength: 2000
      example: Слоёное тесто, миндальный крем
    price:
      $ref: '../../../../common/v1/components/schemas.yaml#/Money'
    stock:
      $ref: '#/Stock'
    in_stop_list:
      type: boolean
      description: Оператор отметил, что позиции сейчас нет.
      example: false
    is_available:
      type: boolean
      description: |
        Итог, который видит площадка: позиция не в стоп-листе и её остаток больше нуля.
        Значение вычисляется коробкой и в запросах не принимается — им управляют отметка
        стоп-листа и остаток.
      example: true

MenuItemPage:
  type: object
  description: Страница меню.
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/MenuItem'
    page:
      $ref: '../../../../common/v1/components/schemas.yaml#/PageMeta'

MenuItemUpdate:
  type: object
  description: |
    Полная замена карточки позиции. Описание можно не присылать — тогда его не станет:
    это правка карточки целиком, а не частичная.
  required:
    - name
    - price
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: Круассан с миндалём
    description:
      type: string
      maxLength: 2000
      example: Слоёное тесто, миндальный крем
    price:
      $ref: '../../../../common/v1/components/schemas.yaml#/Money'

NewMenuItem:
  type: object
  description: |
    Новая позиция меню. Остаток указывается сразу: позиция без остатка недоступна, и
    умолчание здесь решало бы за оператора, продаётся его блюдо или нет.
  required:
    - name
    - price
    - stock
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: Круассан с миндалём
    description:
      type: string
      maxLength: 2000
      example: Слоёное тесто, миндальный крем
    price:
      $ref: '../../../../common/v1/components/schemas.yaml#/Money'
    stock:
      $ref: '#/Stock'

Stock:
  type: integer
  minimum: 0
  maximum: 1000000
  description: |
    Остаток позиции в штуках. Ноль — заказать нечего: позиция уезжает площадке недоступной,
    но из меню не пропадает. Верхняя граница отсекает опечатку в форме: остатка больше
    миллиона порций у кухни не бывает, а число сверх него коробке негде хранить.
  example: 12

StockUpdate:
  type: object
  description: Новый остаток позиции — целиком, а не приращением.
  required:
    - stock
  properties:
    stock:
      $ref: '#/Stock'

StopListMark:
  type: object
  description: |
    Отметка стоп-листа. Истина — позиции сейчас нет, ложь — снова в наличии.
  required:
    - in_stop_list
  properties:
    in_stop_list:
      type: boolean
      example: true

Order:
  type: object
  description: |
    Входящий заказ глазами оператора: состав, адрес доставки и состояние. По нему оператор
    решает, берётся заведение за заказ или нет.
  required:
    - id
    - platform_order_id
    - status
    - address
    - items
    - total
    - accepted_at
  properties:
    id:
      type: string
      format: uuid
      description: Идентификатор заказа в коробке.
      example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a05
    platform_order_id:
      type: string
      format: uuid
      description: |
        Тот же заказ на площадке. Хранится ссылкой, а не подменяет собой идентификатор
        коробки: по нему разбираются с площадкой, когда заказ вызывает вопросы.
      example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a03
    status:
      $ref: '#/OrderStatus'
    address:
      type: string
      minLength: 1
      maxLength: 500
      description: Адрес доставки в свободной форме, как его передала площадка.
      example: Москва, Лесная 7, кв. 12
    items:
      type: array
      minItems: 1
      items:
        $ref: '#/OrderItem'
    total:
      allOf:
        - $ref: '../../../../common/v1/components/schemas.yaml#/Money'
      description: Сумма заказа, посчитанная коробкой по своим ценам.
    cancellation_reason:
      type: string
      maxLength: 500
      description: |
        Причина, по которой оператор отклонил заказ. Есть только у отклонённого заказа:
        площадка показывает её покупателю.
      example: Закончились продукты
    placed_at:
      type: string
      format: date-time
      description: Когда покупатель оформил заказ на площадке; площадка может его не прислать.
    accepted_at:
      type: string
      format: date-time
      description: Когда коробка приняла заказ по партнёрскому контракту.

OrderItem:
  type: object
  description: |
    Позиция заказа — снимок на момент приёма: название и цена сохранены такими, какими
    были, когда заказ приняли. Правка меню задним числом заказ не меняет: оператор готовит
    то, что заказал покупатель, и по той цене, которую тот видел.
  required:
    - menu_item_id
    - name
    - quantity
    - price
  properties:
    menu_item_id:
      type: string
      format: uuid
      description: |
        Позиция меню, из которой собран заказ. Позицию могли с тех пор изменить или удалить —
        состав заказа от этого не меняется.
      example: 018f2b5c-1f4a-7c3e-9a10-2b8f5d7c1a04
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: Круассан с миндалём
    quantity:
      $ref: '../../../../common/v1/components/schemas.yaml#/Quantity'
    price:
      $ref: '../../../../common/v1/components/schemas.yaml#/Money'

OrderPage:
  type: object
  description: Страница входящих заказов.
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        $ref: '#/Order'
    page:
      $ref: '../../../../common/v1/components/schemas.yaml#/PageMeta'

OrderStatus:
  type: string
  description: |
    Состояние заказа в коробке. `under_review` — заказ принят по партнёрскому контракту и
    ждёт решения оператора; `confirmed` — оператор взялся за него; `cancelled` — оператор
    отклонил его на этапе рассмотрения.

    Отклонённый заказ становится именно отменённым, а не «отклонённым»: это тот же статус,
    о котором коробка сообщает площадке, и заводить для одного состояния два названия
    значило бы переводить одно в другое на каждой границе.
  enum:
    - under_review
    - confirmed
    - cancelled
  example: under_review

Rejection:
  type: object
  description: Причина, по которой оператор не берётся за заказ.
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 500
      example: Закончились продукты
