put:
  operationId: setStock
  summary: Задать остаток позиции
  description: |
    Остаток задаётся целиком, а не приращением: оператор пересчитал и сообщил, сколько
    осталось, — повтор запроса по таймауту не должен списать порцию дважды.

    Позиция с нулевым остатком уезжает площадке недоступной, даже если она не в
    стоп-листе: заказывать нечего.
  tags:
    - menu
  parameters:
    - $ref: '../components/parameters.yaml#/MenuItemId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas.yaml#/StockUpdate'
  responses:
    '200':
      description: Остаток записан.
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/MenuItem'
    '400':
      $ref: '../../../../common/v1/components/responses.yaml#/BadRequest'
    '404':
      $ref: '../../../../common/v1/components/responses.yaml#/NotFound'
