# Одна команда поднимает всю площадку: `docker compose up --build`.
# Значения по умолчанию заданы прямо здесь, поэтому запуск работает и без `.env`;
# полный список ключей — в `.env.example`.
name: avito-kitchen

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitchen}
      POSTGRES_DB: ${POSTGRES_DB:-kitchen}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Данные лежат в каталоге репозитория, а не в томе Docker: полный сброс Docker
      # (`docker system prune --volumes`, переустановка) их не трогает, и заглянуть в них
      # можно обычными средствами хоста. У образа postgres:18 данные лежат в подкаталоге
      # /var/lib/postgresql/<версия>, поэтому монтируется каталог целиком — иначе не
      # сработает pg_upgrade.
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitchen} -d ${POSTGRES_DB:-kitchen}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Миграции — отдельный шаг запуска, а не часть старта служб: службе, которая мигрирует
  # сама, нужны права на изменение схемы в бою, а при нескольких экземплярах — ещё и
  # договорённость, кто накатывает первым. Службы стартуют только после того, как этот
  # шаг завершился успешно.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
      # Демо-данные включены по умолчанию: `docker compose up` поднимает демо, и без них
      # витрина после запуска пуста. Ключ демо-заведения опубликован (README), поэтому
      # там, где базу поднимают не для демонстрации, переменная выставляется в 0.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
    depends_on:
      postgres:
        condition: service_healthy

  platform:
    build:
      context: .
      args:
        SERVICE: platform
    environment:
      PLATFORM_HTTP_PORT: ${PLATFORM_HTTP_PORT:-8080}
      PLATFORM_SHUTDOWN_TIMEOUT: ${PLATFORM_SHUTDOWN_TIMEOUT:-10s}
      PLATFORM_LOG_LEVEL: ${PLATFORM_LOG_LEVEL:-info}
      # Служба подключается к уже накатанной базе: мигрирует отдельный шаг выше.
      PLATFORM_DATABASE_DSN: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
    ports:
      - "${PLATFORM_HTTP_PORT:-8080}:${PLATFORM_HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${PLATFORM_HTTP_PORT:-8080}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  restaurant:
    build:
      context: .
      args:
        SERVICE: restaurant
    environment:
      RESTAURANT_HTTP_PORT: ${RESTAURANT_HTTP_PORT:-8081}
      RESTAURANT_SHUTDOWN_TIMEOUT: ${RESTAURANT_SHUTDOWN_TIMEOUT:-10s}
      RESTAURANT_LOG_LEVEL: ${RESTAURANT_LOG_LEVEL:-info}
      # Коробка подключается к уже накатанной базе: мигрирует отдельный шаг выше.
      # Схема у неё своя (`restaurant`), инстанс общий с площадкой — экономия на
      # инфраструктуре демо, в эксплуатации у заведения свой.
      RESTAURANT_DATABASE_DSN: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
    ports:
      - "${RESTAURANT_HTTP_PORT:-8081}:${RESTAURANT_HTTP_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:${RESTAURANT_HTTP_PORT:-8081}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

