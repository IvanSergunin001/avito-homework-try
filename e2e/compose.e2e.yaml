# Надстройка над `compose.yaml` для сквозного теста: файл запуска берётся тот же самый,
# и меняется в нём ровно то, что делает прогон повторяемым и ни с чем не спорящим, —
# порты хоста и место, где живут данные базы.
#
# Зачем. Сквозной тест поднимает систему там, где у разработчика уже может быть поднят
# `make up`, и на агенте CI, где 5432 занят чем угодно. Фиксированные порты из
# `compose.yaml` означали бы, что тест падает не оттого, что сломана система, а оттого,
# что порт занят. Случайный порт хоста тест узнаёт у самого Compose (`docker compose port`).
#
# `!override` заменяет список портов целиком: списки Compose по умолчанию склеивает, и без
# этой пометки к случайному порту добавился бы фиксированный, а вместе с ним и конфликт.
#
# Внутренние порты не меняются: службы находят друг друга по именам в сети Compose, и адрес
# площадки в конфигурации коробки остаётся тем же, что в обычном запуске. Подменять этой
# надстройкой что-либо ещё — образы, переменные, зависимости — нельзя: тем, что она
# описывает, система и проверяется.
services:
  platform:
    ports: !override
      - "8080"

  restaurant:
    ports: !override
      - "8081"

  # Базу сквозной тест наружу не публикует вовсе: он ходит в систему теми же дверями, что
  # покупатель и оператор, — по HTTP, — и заглядывать в её хранилище ему нечем и незачем.
  postgres:
    ports: !override []

    # Данные базы уезжают из каталога репозитория в том Docker. В обычном запуске каталог —
    # осознанное решение (`./.data` переживает сброс Docker), но прогону он вреден сразу
    # дважды. Каталог не уносит `down --volumes`, поэтому следующий прогон получал бы базу
    # предыдущего вместе с журналом goose — а из-за журнала миграции к ней уже не
    # применяются, и схема, изменившаяся с прошлого прогона, до базы не доезжает. И путь
    # `./.data` разрешается там, откуда запущен клиент Compose, а `make test` запускает его
    # изнутри контейнера с тестами — каталог создавался бы на хосте вне репозитория.
    # Безымянный том живёт ровно столько, сколько система теста: `down --volumes` уносит
    # его вместе с ней.
    volumes: !override
      - /var/lib/postgresql
